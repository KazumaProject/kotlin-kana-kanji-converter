name: Build and Release JapaneseKeyboard Dictionary Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: 'google/mozc ref to use for dictionary resources'
        required: false
        default: 'master'
      counter_preview:
        description: 'Build and publish a counter dictionary preview from the selected ref'
        type: boolean
        required: false
        default: false

env:
  MOZC_REF: ${{ github.event.inputs.mozc_ref || 'master' }}

  # JapaneseCorpus:
  # Do NOT pin a release tag or SHA256 here.
  # The workflow automatically resolves the latest published release
  # and verifies the downloaded asset against that same release.
  JAPANESE_CORPUS_REPOSITORY: 'KazumaProject/JapaneseCorpus'
  JAPANESE_CORPUS_ENGLISH_ASSET: 'mozc-english-reading-unigram-00000.txt.zst'
  JAPANESE_CORPUS_ENGLISH_MANIFEST: 'english-dictionary-manifest.json'
  JAPANESE_CORPUS_ENGLISH_SHA256SUMS: 'ENGLISH-DICTIONARY-SHA256SUMS'

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.counter_preview }}
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # Checkout Mozc once so id.def, dictionary, suffix, connection,
      # zero-query, emoji, emoticon, symbol, and single-kanji resources all
      # come from the same Mozc revision.
      - name: Checkout google/mozc
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: mozc-src

      # ----------------------------------------------------------------------
      # Java
      # ----------------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ----------------------------------------------------------------------
      # Mozc resources
      # ----------------------------------------------------------------------

      - name: Copy Mozc dictionary resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./src/main/resources

          cp \
            ./mozc-src/src/data/dictionary_oss/id.def \
            ./src/main/resources/id.def

          for i in $(seq -w 00 09); do
            cp \
              "./mozc-src/src/data/dictionary_oss/dictionary${i}.txt" \
              "./src/main/resources/dictionary${i}.txt"
          done

          cp \
            ./mozc-src/src/data/dictionary_oss/connection_single_column.txt \
            ./src/main/resources/connection_single_column.txt

          cp \
            ./mozc-src/src/data/dictionary_oss/suffix.txt \
            ./src/main/resources/suffix.txt

          cp \
            ./mozc-src/src/data/single_kanji/single_kanji.tsv \
            ./src/main/resources/single_kanji.tsv

          cp \
            ./mozc-src/src/data/zero_query/zero_query.def \
            ./src/main/resources/zero_query.def

          cp \
            ./mozc-src/src/data/zero_query/zero_query_number.def \
            ./src/main/resources/zero_query_number.def

          cp \
            ./mozc-src/src/data/emoji/emoji_data.tsv \
            ./src/main/resources/mozc_emoji_data.tsv

          cp \
            ./mozc-src/src/data/emoticon/categorized.tsv \
            ./src/main/resources/mozc_emoticon_categorized.tsv

          cp \
            ./mozc-src/src/data/symbol/symbol.tsv \
            ./src/main/resources/mozc_symbol.tsv

      - name: Verify Mozc resources exist
        shell: bash
        run: |
          set -euo pipefail

          test -s ./src/main/resources/id.def
          test -s ./src/main/resources/connection_single_column.txt
          test -s ./src/main/resources/suffix.txt
          test -s ./src/main/resources/single_kanji.tsv
          test -s ./src/main/resources/zero_query.def
          test -s ./src/main/resources/zero_query_number.def
          test -s ./src/main/resources/mozc_emoji_data.tsv
          test -s ./src/main/resources/mozc_emoticon_categorized.tsv
          test -s ./src/main/resources/mozc_symbol.tsv

          test -f ./src/main/custom_zero_query.def

          for i in $(seq -w 00 09); do
            test -s "./src/main/resources/dictionary${i}.txt"
          done

      # ----------------------------------------------------------------------
      # JapaneseCorpus English dictionary
      #
      # JapaneseCorpus is automatically rebuilt and its release version
      # changes over time.
      #
      # Therefore:
      #   - Never pin JAPANESE_CORPUS_TAG
      #   - Never pin the dictionary SHA256
      #   - Resolve one published release first
      #   - Download every required file from that exact release
      #   - Verify the asset against SHA256SUMS from that exact release
      #   - Verify the manifest describes the same asset/checksum
      #
      # This also prevents a race where "latest" changes between downloads.
      # ----------------------------------------------------------------------

      - name: Download and verify latest JapaneseCorpus English dictionary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Resolving latest published JapaneseCorpus release..."

          JAPANESE_CORPUS_TAG="$(
            gh api \
              "repos/${JAPANESE_CORPUS_REPOSITORY}/releases/latest" \
              --jq '.tag_name'
          )"

          if [[ -z "${JAPANESE_CORPUS_TAG}" || "${JAPANESE_CORPUS_TAG}" == "null" ]]; then
            echo "Failed to resolve latest JapaneseCorpus release tag." >&2
            exit 1
          fi

          echo "JapaneseCorpus repository: ${JAPANESE_CORPUS_REPOSITORY}"
          echo "JapaneseCorpus release:    ${JAPANESE_CORPUS_TAG}"
          echo "English asset:             ${JAPANESE_CORPUS_ENGLISH_ASSET}"
          echo "Manifest:                  ${JAPANESE_CORPUS_ENGLISH_MANIFEST}"
          echo "SHA256SUMS:                ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}"

          DOWNLOAD_DIR="${RUNNER_TEMP}/japanese-corpus"
          mkdir -p "${DOWNLOAD_DIR}"

          echo "Downloading files from the same JapaneseCorpus release..."

          gh release download "${JAPANESE_CORPUS_TAG}" \
            --repo "${JAPANESE_CORPUS_REPOSITORY}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_ASSET}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_MANIFEST}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}" \
            --dir "${DOWNLOAD_DIR}"

          ASSET_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_ASSET}"
          MANIFEST_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_MANIFEST}"
          SHA256SUMS_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}"

          echo "Verifying downloaded files exist..."

          test -s "${ASSET_PATH}"
          test -s "${MANIFEST_PATH}"
          test -s "${SHA256SUMS_PATH}"

          echo "Extracting expected SHA256 from ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}..."

          EXPECTED_SHA256="$(
            awk \
              -v asset="${JAPANESE_CORPUS_ENGLISH_ASSET}" \
              '$2 == asset || $2 == ("*" asset) { print $1; exit }' \
              "${SHA256SUMS_PATH}"
          )"

          if [[ -z "${EXPECTED_SHA256}" ]]; then
            echo \
              "Could not find ${JAPANESE_CORPUS_ENGLISH_ASSET} in ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}." \
              >&2
            echo "Available checksum entries:" >&2
            cat "${SHA256SUMS_PATH}" >&2
            exit 1
          fi

          if [[ ! "${EXPECTED_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid SHA256 in checksum file: ${EXPECTED_SHA256}" >&2
            exit 1
          fi

          echo "Expected SHA256: ${EXPECTED_SHA256}"

          ACTUAL_SHA256="$(
            sha256sum "${ASSET_PATH}" | awk '{print $1}'
          )"

          echo "Actual SHA256:   ${ACTUAL_SHA256}"

          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "JapaneseCorpus English dictionary SHA256 mismatch." >&2
            exit 1
          fi

          echo "SHA256 verification passed."

          echo "Validating English dictionary manifest..."

          jq -e \
            --arg asset "${JAPANESE_CORPUS_ENGLISH_ASSET}" \
            --arg sha "${EXPECTED_SHA256}" \
            '
              .parameters.dictionary_kind == "direct-loanword"
              and
              (
                .assets[]
                | select(.name == $asset)
                | .sha256
              ) == $sha
            ' \
            "${MANIFEST_PATH}" \
            >/dev/null

          echo "Manifest verification passed."

          echo "Testing zstd archive..."

          zstd --test "${ASSET_PATH}"

          echo "Decompressing English dictionary..."

          zstd \
            --decompress \
            --stdout \
            "${ASSET_PATH}" \
            > ./src/main/resources/english-dictionary.txt

          test -s ./src/main/resources/english-dictionary.txt

          echo "JapaneseCorpus English dictionary successfully installed."
          echo "Source release: ${JAPANESE_CORPUS_TAG}"

      # ----------------------------------------------------------------------
      # Source validation
      # ----------------------------------------------------------------------

      - name: Verify English dictionary source
        run: ./gradlew validateEnglishDictionary

      - name: Validate Mozc resource consistency
        run: |
          ./gradlew \
            validateMozcIdDef \
            validateConnectionMatrix \
            validateDictionaryIds \
            validateIdDefReferences

      - name: Validate Mozc zero query resources
        run: ./gradlew validateMozcZeroQueryResources

      # ----------------------------------------------------------------------
      # Kotlin compilation
      # ----------------------------------------------------------------------

      - name: Compile Kotlin
        run: ./gradlew clean compileKotlin

      # ----------------------------------------------------------------------
      # English dictionary report
      # ----------------------------------------------------------------------

      - name: Generate English dictionary report
        run: ./gradlew analyzeEnglishDictionary

      - name: Upload English dictionary report
        uses: actions/upload-artifact@v4
        with:
          name: english-dictionary-report
          path: build/reports/english-dictionary

      # ----------------------------------------------------------------------
      # N-gram dictionary
      # ----------------------------------------------------------------------

      - name: Build and verify scoreless system n-gram dictionary
        run: |
          ./gradlew \
            buildSystemNgramDictionary \
            test \
            --tests 'com.kazumaproject.ngram.SystemNgramBinaryTest'

      - name: Upload n-gram build report
        uses: actions/upload-artifact@v4
        with:
          name: ngram-build-report
          path: build/reports/ngram/build.txt

      # ----------------------------------------------------------------------
      # Zero-query parity / generation
      # ----------------------------------------------------------------------

      - name: Verify Mozc zero query parity
        run: |
          ./gradlew \
            verifyMozcZeroQueryParity \
            -PmozcSourceDir=./mozc-src

      - name: Generate and verify Mozc zero query data
        run: |
          ./gradlew \
            generateMozcZeroQueryData \
            verifyMozcZeroQueryData

      # ----------------------------------------------------------------------
      # Package dictionary assets
      # ----------------------------------------------------------------------

      - name: Build and verify counter and time rules
        run: ./gradlew buildCounterDictionary counterTest

      - name: Upload counter build report
        uses: actions/upload-artifact@v4
        with:
          name: counter-build-report
          path: build/reports/counter/*.json

      - name: Generate dictionaries, package assets, and verify
        run: |
          ./gradlew \
            packageJapaneseKeyboardDictionaryAssets \
            verifyJapaneseKeyboardDictionaryAssets

      # Engine tests load the generated dictionary .dat files,
      # so run them after packaging.
      - name: Test with Gradle
        run: ./gradlew test

      # ----------------------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: ./release_zips/japanese_keyboard_dictionary_assets.zip
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          replacesArtifacts: true

      # Keep release records for history, but retain downloadable files and
      # Git tags only for the five newest published v* releases.
      - name: Retain assets and tags for the latest five releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const publishedVersionReleases = releases
              .filter(
                (release) =>
                  !release.draft &&
                  !release.prerelease &&
                  release.tag_name.startsWith('v')
              )
              .sort(
                (left, right) =>
                  new Date(right.published_at || right.created_at) -
                  new Date(left.published_at || left.created_at)
              );

            const expiredReleases = publishedVersionReleases.slice(5);

            for (const release of expiredReleases) {
              for (const asset of release.assets) {
                core.info(
                  `Deleting ${asset.name} from ${release.tag_name}`
                );

                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }

              const tagRef = `tags/${release.tag_name}`;

              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });

                core.info(`Deleting tag ${release.tag_name}`);

                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                core.info(
                  `Tag ${release.tag_name} is already absent`
                );
              }
            }

            core.info(
              `Retained assets and tags for ${
                Math.min(publishedVersionReleases.length, 5)
              } releases; processed ${
                expiredReleases.length
              } older releases.`
            );

  counter-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.counter_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v4

      - name: Checkout Mozc for compilation context IDs
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: mozc-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare compilation resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources
          cp mozc-src/src/data/dictionary_oss/id.def src/main/resources/id.def
          echo "MOZC_COMMIT=$(git -C mozc-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build dictionary and run counter tests
        run: ./gradlew buildCounterDictionary counterTest --console=plain

      - name: Generate catalog and golden verification report
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -q counterCli --args='inspect --list --report build/reports/counter/catalog.json' > /dev/null
          ./gradlew -q counterCli --args='check --report build/reports/counter/golden.json'

      - name: Package dictionary preview and checksums
        run: python3 scripts/package_counter_preview.py

      - name: Upload downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-dictionary-preview-${{ github.sha }}
          path: |
            build/counter-preview/counter_rules.dat
            build/counter-preview/counter_dictionary_preview.zip
            build/counter-preview/manifest.json
            build/counter-preview/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish public preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          preview_tag="counter-preview-${GITHUB_SHA:0:12}"
          assets=(
            build/counter-preview/counter_rules.dat
            build/counter-preview/counter_dictionary_preview.zip
            build/counter-preview/manifest.json
            build/counter-preview/SHA256SUMS
          )
          if gh release view "$preview_tag" >/dev/null 2>&1; then
            gh release upload "$preview_tag" "${assets[@]}" --clobber
          else
            gh release create "$preview_tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "助数詞辞書の検証用配布 / Counter dictionary preview (${GITHUB_SHA:0:12})" \
              --notes-file build/counter-preview/RELEASE_NOTES.md
          fi
          gh release view "$preview_tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
