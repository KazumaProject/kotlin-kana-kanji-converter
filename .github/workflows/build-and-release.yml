name: Build and Release JapaneseKeyboard Dictionary Assets

on:
  push:
    tags:
      - 'v*'
      - 'person-dictionaries-v*'
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: 'google/mozc ref to use for dictionary resources'
        required: false
        default: 'master'

env:
  MOZC_REF: ${{ github.event.inputs.mozc_ref || 'master' }}

  # JapaneseCorpus:
  # Do NOT pin a release tag or SHA256 here.
  # The workflow automatically resolves the latest published release
  # and verifies the downloaded asset against that same release.
  JAPANESE_CORPUS_REPOSITORY: 'KazumaProject/JapaneseCorpus'
  JAPANESE_CORPUS_ENGLISH_ASSET: 'mozc-english-reading-unigram-00000.txt.zst'
  JAPANESE_CORPUS_ENGLISH_MANIFEST: 'english-dictionary-manifest.json'
  JAPANESE_CORPUS_ENGLISH_SHA256SUMS: 'ENGLISH-DICTIONARY-SHA256SUMS'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # Checkout Mozc once so id.def, dictionary, suffix, connection,
      # zero-query, emoji, emoticon, symbol, and single-kanji resources all
      # come from the same Mozc revision.
      - name: Checkout google/mozc
        uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: mozc-src

      # ----------------------------------------------------------------------
      # Java
      # ----------------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ----------------------------------------------------------------------
      # Mozc resources
      # ----------------------------------------------------------------------

      - name: Copy Mozc dictionary resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./src/main/resources

          cp \
            ./mozc-src/src/data/dictionary_oss/id.def \
            ./src/main/resources/id.def

          for i in $(seq -w 00 09); do
            cp \
              "./mozc-src/src/data/dictionary_oss/dictionary${i}.txt" \
              "./src/main/resources/dictionary${i}.txt"
          done

          cp \
            ./mozc-src/src/data/dictionary_oss/connection_single_column.txt \
            ./src/main/resources/connection_single_column.txt

          cp \
            ./mozc-src/src/data/dictionary_oss/suffix.txt \
            ./src/main/resources/suffix.txt

          cp \
            ./mozc-src/src/data/single_kanji/single_kanji.tsv \
            ./src/main/resources/single_kanji.tsv

          cp \
            ./mozc-src/src/data/zero_query/zero_query.def \
            ./src/main/resources/zero_query.def

          cp \
            ./mozc-src/src/data/zero_query/zero_query_number.def \
            ./src/main/resources/zero_query_number.def

          cp \
            ./mozc-src/src/data/emoji/emoji_data.tsv \
            ./src/main/resources/mozc_emoji_data.tsv

          cp \
            ./mozc-src/src/data/emoticon/categorized.tsv \
            ./src/main/resources/mozc_emoticon_categorized.tsv

          cp \
            ./mozc-src/src/data/symbol/symbol.tsv \
            ./src/main/resources/mozc_symbol.tsv

      - name: Verify Mozc resources exist
        shell: bash
        run: |
          set -euo pipefail

          test -s ./src/main/resources/id.def
          test -s ./src/main/resources/connection_single_column.txt
          test -s ./src/main/resources/suffix.txt
          test -s ./src/main/resources/single_kanji.tsv
          test -s ./src/main/resources/zero_query.def
          test -s ./src/main/resources/zero_query_number.def
          test -s ./src/main/resources/mozc_emoji_data.tsv
          test -s ./src/main/resources/mozc_emoticon_categorized.tsv
          test -s ./src/main/resources/mozc_symbol.tsv

          test -f ./src/main/custom_zero_query.def

          for i in $(seq -w 00 09); do
            test -s "./src/main/resources/dictionary${i}.txt"
          done

      # ----------------------------------------------------------------------
      # JapaneseCorpus English dictionary
      #
      # JapaneseCorpus is automatically rebuilt and its release version
      # changes over time.
      #
      # Therefore:
      #   - Never pin JAPANESE_CORPUS_TAG
      #   - Never pin the dictionary SHA256
      #   - Resolve one published release first
      #   - Download every required file from that exact release
      #   - Verify the asset against SHA256SUMS from that exact release
      #   - Verify the manifest describes the same asset/checksum
      #
      # This also prevents a race where "latest" changes between downloads.
      # ----------------------------------------------------------------------

      - name: Download and verify latest JapaneseCorpus English dictionary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Resolving latest published JapaneseCorpus release..."

          JAPANESE_CORPUS_TAG="$(
            gh api \
              "repos/${JAPANESE_CORPUS_REPOSITORY}/releases/latest" \
              --jq '.tag_name'
          )"

          if [[ -z "${JAPANESE_CORPUS_TAG}" || "${JAPANESE_CORPUS_TAG}" == "null" ]]; then
            echo "Failed to resolve latest JapaneseCorpus release tag." >&2
            exit 1
          fi

          echo "JapaneseCorpus repository: ${JAPANESE_CORPUS_REPOSITORY}"
          echo "JapaneseCorpus release:    ${JAPANESE_CORPUS_TAG}"
          echo "English asset:             ${JAPANESE_CORPUS_ENGLISH_ASSET}"
          echo "Manifest:                  ${JAPANESE_CORPUS_ENGLISH_MANIFEST}"
          echo "SHA256SUMS:                ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}"

          DOWNLOAD_DIR="${RUNNER_TEMP}/japanese-corpus"
          mkdir -p "${DOWNLOAD_DIR}"

          echo "Downloading files from the same JapaneseCorpus release..."

          gh release download "${JAPANESE_CORPUS_TAG}" \
            --repo "${JAPANESE_CORPUS_REPOSITORY}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_ASSET}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_MANIFEST}" \
            --pattern "${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}" \
            --dir "${DOWNLOAD_DIR}"

          ASSET_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_ASSET}"
          MANIFEST_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_MANIFEST}"
          SHA256SUMS_PATH="${DOWNLOAD_DIR}/${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}"

          echo "Verifying downloaded files exist..."

          test -s "${ASSET_PATH}"
          test -s "${MANIFEST_PATH}"
          test -s "${SHA256SUMS_PATH}"

          echo "Extracting expected SHA256 from ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}..."

          EXPECTED_SHA256="$(
            awk \
              -v asset="${JAPANESE_CORPUS_ENGLISH_ASSET}" \
              '$2 == asset || $2 == ("*" asset) { print $1; exit }' \
              "${SHA256SUMS_PATH}"
          )"

          if [[ -z "${EXPECTED_SHA256}" ]]; then
            echo \
              "Could not find ${JAPANESE_CORPUS_ENGLISH_ASSET} in ${JAPANESE_CORPUS_ENGLISH_SHA256SUMS}." \
              >&2
            echo "Available checksum entries:" >&2
            cat "${SHA256SUMS_PATH}" >&2
            exit 1
          fi

          if [[ ! "${EXPECTED_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid SHA256 in checksum file: ${EXPECTED_SHA256}" >&2
            exit 1
          fi

          echo "Expected SHA256: ${EXPECTED_SHA256}"

          ACTUAL_SHA256="$(
            sha256sum "${ASSET_PATH}" | awk '{print $1}'
          )"

          echo "Actual SHA256:   ${ACTUAL_SHA256}"

          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "JapaneseCorpus English dictionary SHA256 mismatch." >&2
            exit 1
          fi

          echo "SHA256 verification passed."

          echo "Validating English dictionary manifest..."

          jq -e \
            --arg asset "${JAPANESE_CORPUS_ENGLISH_ASSET}" \
            --arg sha "${EXPECTED_SHA256}" \
            '
              .parameters.dictionary_kind == "direct-loanword"
              and
              (
                .assets[]
                | select(.name == $asset)
                | .sha256
              ) == $sha
            ' \
            "${MANIFEST_PATH}" \
            >/dev/null

          echo "Manifest verification passed."

          echo "Testing zstd archive..."

          zstd --test "${ASSET_PATH}"

          echo "Decompressing English dictionary..."

          zstd \
            --decompress \
            --stdout \
            "${ASSET_PATH}" \
            > ./src/main/resources/english-dictionary.txt

          test -s ./src/main/resources/english-dictionary.txt

          echo "JapaneseCorpus English dictionary successfully installed."
          echo "Source release: ${JAPANESE_CORPUS_TAG}"

      # ----------------------------------------------------------------------
      # Source validation
      # ----------------------------------------------------------------------

      - name: Verify frozen classified distribution
        run: |
          python3 -m venv "${RUNNER_TEMP}/term-collection-venv"
          "${RUNNER_TEMP}/term-collection-venv/bin/python" -m pip install -r scripts/requirements-term-collection.txt
          "${RUNNER_TEMP}/term-collection-venv/bin/python" -m unittest discover -s scripts -p 'test_*.py' -v
          "${RUNNER_TEMP}/term-collection-venv/bin/python" scripts/write_classified_dictionary_catalog.py --check

      - name: Verify English dictionary source
        run: ./gradlew validateEnglishDictionary

      - name: Validate Mozc resource consistency
        run: |
          ./gradlew \
            validateMozcIdDef \
            validateConnectionMatrix \
            validateDictionaryIds \
            validateIdDefReferences

      - name: Validate Mozc zero query resources
        run: ./gradlew validateMozcZeroQueryResources

      # ----------------------------------------------------------------------
      # Kotlin compilation
      # ----------------------------------------------------------------------

      - name: Compile Kotlin
        run: ./gradlew clean compileKotlin

      # ----------------------------------------------------------------------
      # English dictionary report
      # ----------------------------------------------------------------------

      - name: Generate English dictionary report
        run: ./gradlew analyzeEnglishDictionary

      - name: Upload English dictionary report
        uses: actions/upload-artifact@v4
        with:
          name: english-dictionary-report
          path: build/reports/english-dictionary

      # ----------------------------------------------------------------------
      # N-gram dictionary
      # ----------------------------------------------------------------------

      - name: Build and verify scoreless system n-gram dictionary
        run: |
          ./gradlew \
            buildSystemNgramDictionary \
            test \
            --tests 'com.kazumaproject.ngram.SystemNgramBinaryTest'

      - name: Upload n-gram build report
        uses: actions/upload-artifact@v4
        with:
          name: ngram-build-report
          path: build/reports/ngram/build.txt

      # ----------------------------------------------------------------------
      # Zero-query parity / generation
      # ----------------------------------------------------------------------

      - name: Verify Mozc zero query parity
        run: |
          ./gradlew \
            verifyMozcZeroQueryParity \
            -PmozcSourceDir=./mozc-src

      - name: Generate and verify Mozc zero query data
        run: |
          ./gradlew \
            generateMozcZeroQueryData \
            verifyMozcZeroQueryData

      # ----------------------------------------------------------------------
      # Package dictionary assets
      # ----------------------------------------------------------------------

      - name: Generate dictionaries, package assets, and verify
        run: |
          ./gradlew \
            packageJapaneseKeyboardDictionaryAssets \
            verifyJapaneseKeyboardDictionaryAssets \
            buildDictionaryDistributionManifest

      - name: Build the person-category replacement bundle
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/person-dictionaries-v') || github.event_name == 'workflow_dispatch'
        run: ./gradlew buildPersonDictionaryReplacementDistribution

      - name: Exercise replacement category dictionaries with KanaKanjiEngine
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/person-dictionaries-v') || github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew --quiet convertPersonCandidates --no-daemon --args="--archive build/person-dictionary/japanese_keyboard_dictionary_assets.zip --base release_zips/japanese_keyboard_dictionary_assets.zip --category sports --count 10 --expect-candidate 堀米雄斗 ほりごめゆうと"
          ./gradlew --quiet convertPersonCandidates --no-daemon --args="--archive build/person-dictionary/japanese_keyboard_dictionary_assets.zip --base release_zips/japanese_keyboard_dictionary_assets.zip --category manga_illustration --count 10 --expect-candidate あいおいやよい あいおいやよい"
          ./gradlew --quiet convertPersonCandidates --no-daemon --args="--archive build/person-dictionary/japanese_keyboard_dictionary_assets.zip --base release_zips/japanese_keyboard_dictionary_assets.zip --category performing_arts --count 10 --expect-candidate 玉川太福 たまがわだいふく"

      - name: Use categorized person dictionaries for the regular distribution
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          cp build/person-dictionary/japanese_keyboard_dictionary_assets.zip release_zips/japanese_keyboard_dictionary_assets.zip
          cp build/person-dictionary/person-replacement-dictionary-manifest.json release_zips/dictionary-distribution-manifest.json
          cp build/person-dictionary/DICTIONARY-SHA256SUMS release_zips/DICTIONARY-SHA256SUMS

      - name: Verify issue additions and regressions with the shipped dictionary ZIP
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=release_zips/japanese_keyboard_dictionary_assets.zip

          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category system --count 30 --expect-conversion しろ=白 --expect-conversion しろい=白い --expect-conversion しろくろ=白黒 --expect-conversion しろあり=シロアリ しろ しろい しろくろ しろあり"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/general/internet_slang_culture --count 30 --expect-conversion ほびあか=ホビ垢 --expect-conversion うまかく=うま確 --expect-conversion ふれねみー=フレネミー ほびあか うまかく ふれねみー"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/general/other_general --count 30 --expect-conversion どぱがき=ドパガキ どぱがき"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/general/neologisms_trends_youth_language --count 30 --expect-conversion めろい=メロい --expect-conversion せろかつ=セロ活 めろい せろかつ"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/specialist/information_communications --count 30 --expect-conversion えーつーえー=A2A --expect-conversion えふでぃーいー=FDE --expect-conversion けーぶいきゃっしゅ=KVキャッシュ --expect-conversion えむしーぴー=MCP --expect-conversion ふぃじかるえーあい=フィジカルAI --expect-conversion えーじぇんてぃっくえーあい=エージェンティックAI --expect-conversion えーじぇんてぃっくこーでぃんぐ=エージェンティックコーディング --expect-conversion ばいぶこーでぃんぐ=バイブコーディング --expect-conversion こんてきすとえんじにありんぐ=コンテキストエンジニアリング --expect-conversion そぶりんえーあい=ソブリンAI --expect-conversion おーぷんうぇいと=オープンウェイト えーつーえー えふでぃーいー けーぶいきゃっしゅ えむしーぴー ふぃじかるえーあい えーじぇんてぃっくえーあい えーじぇんてぃっくこーでぃんぐ ばいぶこーでぃんぐ こんてきすとえんじにありんぐ そぶりんえーあい おーぷんうぇいと"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/specialist/law_politics --count 30 --expect-conversion まいなきゅうきゅう=マイナ救急 --expect-conversion きんきゅうじゅうりょう=緊急銃猟 まいなきゅうきゅう きんきゅうじゅうりょう"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/specialist/chemistry_life_sciences --count 30 --expect-conversion ぺろぶすかいとたいようでんち=ペロブスカイト太陽電池 ぺろぶすかいとたいようでんち"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/specialist/economics_management --count 30 --expect-conversion とーくんかよきん=トークン化預金 とーくんかよきん"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category term/specialist/earth_environment_resources --count 30 --expect-conversion ふゅーじょんえねるぎー=フュージョンエネルギー ふゅーじょんえねるぎー"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category product --count 30 --expect-conversion めぐりそうか=巡草花 --expect-conversion 'えくすぺりあてんまーくえいと=Xperia 10 VIII' --expect-conversion 'ふぁんしんく=Fan Sync' --expect-conversion 'どるつでんてぃすとりー=ドルツ デンティストリー' --expect-conversion ぷらーくすきゃんぶらし=プラークスキャンブラシ --expect-conversion 'ゔぃらぷりんす=VILLA PRINCE' --expect-conversion ぼんぼんどろっぷしーる=ボンボンドロップシール --expect-conversion えーあいもーど=AIモード --expect-conversion まいなめんきょしょう=マイナ免許証 めぐりそうか えくすぺりあてんまーくえいと ふぁんしんく どるつでんてぃすとりー ぷらーくすきゃんぶらし ゔぃらぷりんす ぼんぼんどろっぷしーる えーあいもーど まいなめんきょしょう"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category organization --count 30 --expect-conversion ぷろけみあ=プロケミア --expect-conversion にほんでぃーえっくすあんてな=日本DXアンテナ ぷろけみあ にほんでぃーえっくすあんてな"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category vehicle --count 30 --expect-conversion 'いーすかい=e SKY' いーすかい"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category facility --count 30 --expect-conversion 'とふろむやえす=TOFROM YAESU' --expect-conversion べーすげーとよこはまかんない=BASEGATE横浜関内 とふろむやえす べーすげーとよこはまかんない"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category work_music --count 30 --expect-conversion あいかろちゅう=愛カロ厨 あいかろちゅう"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category work_program --count 30 --expect-conversion ろすとてん=LOST10 ろすとてん"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category work_game --count 30 --expect-conversion 'れゔのわーる=Rev. NOiR' --expect-conversion 'さんりおぱーてぃらんど=サンリオ パーティランド' --expect-conversion 'ふぁいなるふぁんたじーれぞなんす=ファイナルファンタジー レゾナンス' --expect-conversion すてらーこーど=ステラーコード --expect-conversion あのまりす=アノマリス れゔのわーる さんりおぱーてぃらんど ふぁいなるふぁんたじーれぞなんす すてらーこーど あのまりす"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category work_manga --count 30 --expect-conversion さいれん=PSYREN --expect-conversion おだろく=オダロク --expect-conversion らびっとちぇいさー=ラビットチェイサー --expect-conversion ひがんのほたる=彼岸の螢 --expect-conversion れいばいでい=レイバイデイ さいれん おだろく らびっとちぇいさー ひがんのほたる れいばいでい"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category event/occasion/organized_event --count 30 --expect-conversion じむとふにせんにじゅうろく=JIMTOF2026 じむとふにせんにじゅうろく"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/politics_public --count 30 --expect-conversion ふじいひさゆき=藤井比早之 --expect-conversion せきよしひろ=関芳弘 --expect-conversion いばやしたつのり=井林辰憲 --expect-conversion はなしやすひろ=葉梨康弘 ふじいひさゆき せきよしひろ いばやしたつのり はなしやすひろ"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/surname_origin_japanese --count 30 --expect-conversion ひらぬましょうじろう=平沼正二郎 ひらぬましょうじろう"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/personal_name_origin_japanese --count 30 --expect-conversion はやかわともき=早川友基 --expect-conversion せこあゆむ=瀬古歩夢 --expect-conversion すずきゆいと=鈴木唯人 はやかわともき せこあゆむ すずきゆいと"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/personal_name_origin_unconfirmed --count 30 --expect-conversion おおぞらこうき=大空幸星 --expect-conversion しおがいけんと=塩貝健人 --expect-conversion まちのしゅうと=町野修斗 おおぞらこうき しおがいけんと まちのしゅうと"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/actor --count 30 --expect-conversion さのかいしゅう=佐野海舟 さのかいしゅう"
          ./gradlew --quiet convertCandidates --no-daemon --args="--archive ${ARCHIVE} --category person/sports --count 30 --expect-conversion ごとうけいすけ=後藤啓介 ごとうけいすけ"

      - name: Upload verified dictionary distribution
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: japanese-keyboard-dictionary-assets
          path: |
            release_zips/japanese_keyboard_dictionary_assets.zip
            release_zips/dictionary-distribution-manifest.json
            release_zips/DICTIONARY-SHA256SUMS
            release_zips/DICTIONARY-LICENSES.txt
          if-no-files-found: error

      # Engine tests load the generated dictionary .dat files,
      # so run them after packaging.
      - name: Test with Gradle
        run: ./gradlew test

      # ----------------------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 日本語

            - `term` 辞書を一般語・専門用語の階層カテゴリに再編しました。
            - `event` 辞書を「催し・行事」「事件・事故・災害」「歴史的出来事」の3群に整理し、6つの配布カテゴリを追加しました。
            - 犯罪・テロ・事故に該当する読み・表記ペアは分類専用とし、辞書配布データから除外しました。
            - 汎用 `person` 辞書を人物細分類29カテゴリに置き換え、軍事関係者を除外しました。姓・名・姓名は由来別に分類し、哲学者・思想家は出典を確認した候補だけを含めます。
            - アニメ・漫画作品と架空キャラクターを対象層に分類し、成人向け103組を辞書から除外しました。

            ## English

            - Reorganized the `term` dictionary into hierarchical general and specialist categories.
            - Organized the `event` dictionary into three groups and added six distributable categories.
            - Kept crime, terrorism, and accident pairs for classification only and excluded them from dictionary distribution data.
            - Replaced the generic `person` dictionary with 29 categorized dictionaries, including surname and given-name origin categories, excluding military records, and admitting philosophers and thinkers only from source-verified entries.
            - Classified anime and manga works and fictional characters by target audience, and excluded 103 adult-labeled pairs from the dictionary.
          prerelease: false
          makeLatest: true
          artifacts: ./release_zips/japanese_keyboard_dictionary_assets.zip,./release_zips/dictionary-distribution-manifest.json,./release_zips/DICTIONARY-SHA256SUMS,./release_zips/DICTIONARY-LICENSES.txt
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          replacesArtifacts: true

      # Keep five stable dictionary releases and remove prereleases and their tags.
      - name: Retain the latest five stable releases and delete prereleases
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/person-dictionaries-v')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const isStableDictionaryRelease = (release) =>
              !release.draft &&
              !release.prerelease &&
              /^v\d+\.\d+\.\d+$/.test(release.tag_name);

            const stableReleases = releases
              .filter(isStableDictionaryRelease)
              .sort(
                (left, right) =>
                  new Date(right.published_at || right.created_at) -
                  new Date(left.published_at || left.created_at)
              );

            const prereleases = releases.filter(
              (release) =>
                !release.draft &&
                !isStableDictionaryRelease(release) &&
                (
                  release.prerelease ||
                  release.tag_name.startsWith('person-dictionaries-v') ||
                  /^v\d+\.\d+\.\d+-.+$/.test(release.tag_name)
                )
            );
            const expiredStableReleases = stableReleases.slice(5);
            const expiredReleases = [...prereleases, ...expiredStableReleases];

            for (const release of expiredReleases) {
              core.info(`Deleting release ${release.tag_name}`);

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              const tagRef = `tags/${release.tag_name}`;

              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });

                core.info(`Deleting tag ${release.tag_name}`);

                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                core.info(
                  `Tag ${release.tag_name} is already absent`
                );
              }
            }

            core.info(
              `Retained ${
                Math.min(stableReleases.length, 5)
              } stable dictionary releases; deleted ${
                prereleases.length
              } prereleases and ${
                expiredStableReleases.length
              } older stable releases.`
            );
