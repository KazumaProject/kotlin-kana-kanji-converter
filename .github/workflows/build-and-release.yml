name: Build and Release JapaneseKeyboard Dictionary Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: 'google/mozc ref to use for dictionary resources'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare dictionary inputs
        uses: ./.github/actions/dictionary-inputs
        with:
          mozc-ref: ${{ github.event.inputs.mozc_ref || '' }}

      # ----------------------------------------------------------------------
      # Source validation
      # ----------------------------------------------------------------------

      - name: Verify frozen classified distribution
        run: |
          python3 scripts/dictionary_feedback.py verify
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/write_classified_dictionary_catalog.py --check

      - name: Verify English dictionary source
        run: ./gradlew validateEnglishDictionary

      - name: Validate Mozc resource consistency
        run: |
          ./gradlew \
            validateMozcIdDef \
            validateConnectionMatrix \
            validateDictionaryIds \
            validateIdDefReferences

      - name: Validate Mozc zero query resources
        run: ./gradlew validateMozcZeroQueryResources

      # ----------------------------------------------------------------------
      # Kotlin compilation
      # ----------------------------------------------------------------------

      - name: Compile Kotlin
        run: ./gradlew clean compileKotlin

      # ----------------------------------------------------------------------
      # English dictionary report
      # ----------------------------------------------------------------------

      - name: Generate English dictionary report
        run: ./gradlew analyzeEnglishDictionary

      - name: Upload English dictionary report
        uses: actions/upload-artifact@v4
        with:
          name: english-dictionary-report
          path: build/reports/english-dictionary

      # ----------------------------------------------------------------------
      # N-gram dictionary
      # ----------------------------------------------------------------------

      - name: Build and verify scoreless system n-gram dictionary
        run: |
          ./gradlew \
            buildSystemNgramDictionary \
            test \
            --tests 'com.kazumaproject.ngram.SystemNgramBinaryTest'

      - name: Upload n-gram build report
        uses: actions/upload-artifact@v4
        with:
          name: ngram-build-report
          path: build/reports/ngram/build.txt

      # ----------------------------------------------------------------------
      # Zero-query parity / generation
      # ----------------------------------------------------------------------

      - name: Verify Mozc zero query parity
        run: |
          ./gradlew \
            verifyMozcZeroQueryParity \
            -PmozcSourceDir=./mozc-src

      - name: Generate and verify Mozc zero query data
        run: |
          ./gradlew \
            generateMozcZeroQueryData \
            verifyMozcZeroQueryData

      # ----------------------------------------------------------------------
      # Package dictionary assets
      # ----------------------------------------------------------------------

      - name: Generate dictionaries, package assets, and verify
        run: |
          ./gradlew \
            packageJapaneseKeyboardDictionaryAssets \
            verifyJapaneseKeyboardDictionaryAssets \
            buildDictionaryDistributionManifest

      - name: Upload verified dictionary distribution
        uses: actions/upload-artifact@v4
        with:
          name: japanese-keyboard-dictionary-assets
          path: |
            release_zips/japanese_keyboard_dictionary_assets.zip
            release_zips/dictionary-distribution-manifest.json
            release_zips/DICTIONARY-SHA256SUMS
            release_zips/DICTIONARY-LICENSES.txt
          if-no-files-found: error

      # Engine tests load the generated dictionary .dat files,
      # so run them after packaging.
      - name: Test with Gradle
        run: ./gradlew test

      # ----------------------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Pre-release ${{ github.ref_name }}
          prerelease: true
          makeLatest: false
          artifacts: ./release_zips/japanese_keyboard_dictionary_assets.zip,./release_zips/dictionary-distribution-manifest.json,./release_zips/DICTIONARY-SHA256SUMS,./release_zips/DICTIONARY-LICENSES.txt
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          replacesArtifacts: true

      # Retain five prereleases; regular releases and their tags are not removed.
      - name: Retain the latest five prereleases and tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const publishedReleases = releases
              .filter((release) => !release.draft && release.prerelease)
              .sort(
                (left, right) =>
                  new Date(right.published_at || right.created_at) -
                  new Date(left.published_at || left.created_at)
              );

            const expiredReleases = publishedReleases.slice(5);

            for (const release of expiredReleases) {
              core.info(`Deleting release ${release.tag_name}`);

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              const tagRef = `tags/${release.tag_name}`;

              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });

                core.info(`Deleting tag ${release.tag_name}`);

                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: tagRef,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                core.info(
                  `Tag ${release.tag_name} is already absent`
                );
              }
            }

            core.info(
              `Retained ${
                Math.min(publishedReleases.length, 5)
              } releases; processed ${
                expiredReleases.length
              } older releases.`
            );
