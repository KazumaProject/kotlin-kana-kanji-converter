name: Test English IME pipeline

on:
  pull_request:
    paths:
      - 'english-ime/**'
      - '.github/workflows/test-english-ime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-ime-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  english-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_OPTS: -Xmx4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install catalog parser
        run: python3 -m pip install -r english-ime/tools/requirements-catalog.txt
      - name: Test classification and admission rules
        run: python3 -B -m unittest discover -s english-ime/tools -p 'test_*.py'
      - name: Test English lexicon, review gate and binary writers
        run: bash ./gradlew :english-ime:test :english-ime:installDist --no-daemon
      - name: Verify completed source ledger and regenerate all reviewed assets
        run: python3 -B english-ime/tools/replay_source.py build --out "$RUNNER_TEMP/reviewed-english"
      - name: Convert English text with the regenerated dictionary
        run: |
          python3 -B english-ime/tools/verify_conversion_cli.py \
            --cli english-ime/build/install/english-ime/bin/english-ime \
            --assets "$RUNNER_TEMP/reviewed-english"
      - name: Reproduce and verify the supplementary vocabulary
        run: |
          python3 -B english-ime/tools/replay_source.py build \
            --supplement english-ime/data/supplement \
            --out "$RUNNER_TEMP/reviewed-english-extended"
          python3 -B english-ime/tools/verify_conversion_cli.py \
            --cli english-ime/build/install/english-ime/bin/english-ime \
            --assets "$RUNNER_TEMP/reviewed-english-extended" --supplement
          python3 -B english-ime/tools/catalog_review.py verify \
            --assets "$RUNNER_TEMP/reviewed-english-extended"
          python3 -B english-ime/tools/catalog_review.py verify \
            --assets "$RUNNER_TEMP/reviewed-english-extended" \
            --ledger english-ime/data/catalog/adopted-sparse.tsv \
            --word-lists english-ime/data/catalog/words-sparse
          python3 -B english-ime/tools/catalog_review.py verify \
            --assets "$RUNNER_TEMP/reviewed-english-extended" \
            --ledger english-ime/data/catalog/adopted-coverage.tsv \
            --word-lists english-ime/data/catalog/words-coverage
          python3 -B english-ime/tools/catalog_review.py verify \
            --assets "$RUNNER_TEMP/reviewed-english-extended" \
            --ledger english-ime/data/catalog/adopted-named \
            --word-lists english-ime/data/catalog/words-named \
            --goals english-ime/data/catalog/named-goals.json
      - name: Compare packed and full conversion results for both bundles
        run: |
          english-ime/build/install/english-ime/bin/english-ime pack-runtime \
            --assets "$RUNNER_TEMP/reviewed-english" --out "$RUNNER_TEMP/english-runtime-base"
          python3 -B english-ime/tools/verify_conversion_cli.py \
            --cli english-ime/build/install/english-ime/bin/english-ime \
            --assets "$RUNNER_TEMP/english-runtime-base" \
            --reference-assets "$RUNNER_TEMP/reviewed-english"
          english-ime/build/install/english-ime/bin/english-ime pack-runtime \
            --assets "$RUNNER_TEMP/reviewed-english-extended" --out "$RUNNER_TEMP/english-runtime"
          python3 -B english-ime/tools/verify_conversion_cli.py \
            --cli english-ime/build/install/english-ime/bin/english-ime \
            --assets "$RUNNER_TEMP/english-runtime" \
            --reference-assets "$RUNNER_TEMP/reviewed-english-extended" --supplement
          bash ./gradlew :english-ime:verifySupplementAssets --no-daemon \
            -PenglishBaseAssets="$RUNNER_TEMP/reviewed-english" \
            -PenglishExtendedAssets="$RUNNER_TEMP/reviewed-english-extended" \
            -PenglishRuntimeAssets="$RUNNER_TEMP/english-runtime"
